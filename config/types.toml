# HealthKit sample-type registry.
#
# unit         canonical unit. A raw unit that differs is converted if a conversion is known
#              (apple_health.transform.units), otherwise the source contract fails.
# aggregation  cumulative = values add up over time (sum; overlapping sources must be resolved)
#              discrete   = point measurements (mean / min / max)
#              category   = enumerated states
# min / max    plausible range; values outside are flagged `is_outlier` (never dropped).
#              Note: HealthKit "%" values are fractions (0.97 = 97 %).
#
# Types not listed here are still loaded (kind inferred from the identifier prefix) and
# reported by the data-quality checks as unknown.

# --- Activity / energy (cumulative) -------------------------------------------------------
[types.HKQuantityTypeIdentifierActiveEnergyBurned]
unit = "kcal"
aggregation = "cumulative"
min = 0
max = 2000

[types.HKQuantityTypeIdentifierBasalEnergyBurned]
unit = "kcal"
aggregation = "cumulative"
min = 0
max = 3000

[types.HKQuantityTypeIdentifierStepCount]
unit = "count"
aggregation = "cumulative"
min = 0
max = 50000

[types.HKQuantityTypeIdentifierDistanceWalkingRunning]
unit = "km"
aggregation = "cumulative"
min = 0
max = 50

[types.HKQuantityTypeIdentifierDistanceCycling]
unit = "km"
aggregation = "cumulative"
min = 0
max = 100

[types.HKQuantityTypeIdentifierDistanceSwimming]
unit = "m"
aggregation = "cumulative"
min = 0
max = 5000

[types.HKQuantityTypeIdentifierSwimmingStrokeCount]
unit = "count"
aggregation = "cumulative"
min = 0
max = 5000

[types.HKQuantityTypeIdentifierFlightsClimbed]
unit = "count"
aggregation = "cumulative"
min = 0
max = 500

[types.HKQuantityTypeIdentifierAppleExerciseTime]
unit = "min"
aggregation = "cumulative"
min = 0
max = 1440

[types.HKQuantityTypeIdentifierAppleStandTime]
unit = "min"
aggregation = "cumulative"
min = 0
max = 1440

[types.HKQuantityTypeIdentifierTimeInDaylight]
unit = "min"
aggregation = "cumulative"
min = 0
max = 1440

