# --- Categories ---------------------------------------------------------------------------------
# `values` maps raw enum values to a short label and HealthKit's raw integer value (ordinal).
# Unlisted values get a label derived from the identifier.

[types.HKCategoryTypeIdentifierSleepAnalysis]
aggregation = "category"
[types.HKCategoryTypeIdentifierSleepAnalysis.values]
HKCategoryValueSleepAnalysisInBed = { label = "InBed", ordinal = 0 }
HKCategoryValueSleepAnalysisAsleepUnspecified = { label = "AsleepUnspecified", ordinal = 1 }
HKCategoryValueSleepAnalysisAwake = { label = "Awake", ordinal = 2 }
HKCategoryValueSleepAnalysisAsleepCore = { label = "Core", ordinal = 3 }
HKCategoryValueSleepAnalysisAsleepDeep = { label = "Deep", ordinal = 4 }
HKCategoryValueSleepAnalysisAsleepREM = { label = "REM", ordinal = 5 }

[types.HKCategoryTypeIdentifierAppleStandHour]
aggregation = "category"
[types.HKCategoryTypeIdentifierAppleStandHour.values]
HKCategoryValueAppleStandHourStood = { label = "Stood", ordinal = 0 }
HKCategoryValueAppleStandHourIdle = { label = "Idle", ordinal = 1 }

[types.HKCategoryTypeIdentifierAudioExposureEvent]
aggregation = "category"
[types.HKCategoryTypeIdentifierAudioExposureEvent.values]
HKCategoryValueEnvironmentalAudioExposureEventMomentaryLimit = { label = "MomentaryLimit", ordinal = 1 }

[types.HKCategoryTypeIdentifierHeadphoneAudioExposureEvent]
aggregation = "category"
[types.HKCategoryTypeIdentifierHeadphoneAudioExposureEvent.values]
HKCategoryValueHeadphoneAudioExposureEventSevenDayLimit = { label = "SevenDayLimit", ordinal = 1 }

[types.HKCategoryTypeIdentifierHighHeartRateEvent]
aggregation = "category"

[types.HKCategoryTypeIdentifierMindfulSession]
aggregation = "category"


# --- Workout statistics -> fct_workout columns --------------------------------------------------
# For each WorkoutStatistics type: which statistic becomes which column of fct_workout.
# Values are in the canonical unit of the type above. All statistics (including unlisted
# types) are always available in long form in fct_workout_statistic.

[workout_statistics.HKQuantityTypeIdentifierActiveEnergyBurned]
sum = "active_energy_kcal"

[workout_statistics.HKQuantityTypeIdentifierBasalEnergyBurned]
sum = "basal_energy_kcal"

[workout_statistics.HKQuantityTypeIdentifierDistanceWalkingRunning]
sum = "distance_walking_running_km"

[workout_statistics.HKQuantityTypeIdentifierDistanceCycling]
sum = "distance_cycling_km"

[workout_statistics.HKQuantityTypeIdentifierDistanceSwimming]
sum = "distance_swimming_m"

[workout_statistics.HKQuantityTypeIdentifierSwimmingStrokeCount]
sum = "swimming_stroke_count"

[workout_statistics.HKQuantityTypeIdentifierStepCount]
sum = "step_count"

[workout_statistics.HKQuantityTypeIdentifierHeartRate]
average = "heart_rate_avg_bpm"
minimum = "heart_rate_min_bpm"
maximum = "heart_rate_max_bpm"

[workout_statistics.HKQuantityTypeIdentifierRunningPower]
average = "running_power_avg_w"

[workout_statistics.HKQuantityTypeIdentifierRunningSpeed]
average = "running_speed_avg_kmh"

[workout_statistics.HKQuantityTypeIdentifierRunningStrideLength]
average = "running_stride_length_avg_m"

[workout_statistics.HKQuantityTypeIdentifierRunningGroundContactTime]
average = "running_ground_contact_time_avg_ms"

[workout_statistics.HKQuantityTypeIdentifierRunningVerticalOscillation]
average = "running_vertical_oscillation_avg_cm"
