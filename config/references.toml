# Population and guideline references shown next to the dashboard's numbers (mart_reference).
#
# Each [[set]] is one group of bands for one metric, from one source:
#   kind = "range"       explicit bands (a guideline or a clinical normal range)
#   kind = "percentile"  a population percentile table; bands run between consecutive percentiles
#
# Conventions
# - Values are in the warehouse's units: bpm, ms, mL/kg/min, breaths/min, minutes, km/h, and
#   fractions for shares and percentages (95% is 0.95). `scale` multiplies a set's numbers when the
#   source prints another unit (cm/s x 0.036 = km/h, hours x 60 = minutes, % x 0.01 = fraction).
# - A band is lo <= value < hi; a missing lo or hi leaves that side open.
# - Categories published in whole numbers cover the whole unit: "21-30%" is 21% <= v < 31%, and
#   "12 bpm or less" is v < 13 bpm. Continuous quantities (hours, minutes, steps) use the numbers
#   as published.
# - ages = [min, max] in whole years, both included; a set without ages applies to adults (18+).
#   sex = "Female" or "Male" for sex-specific rows; the profile's biological sex picks the row.
# - target = true marks the recommended or typical band (shaded darker, a green dot on tiles);
#   warn = true marks a band that the source calls abnormal or not recommended (a red dot).
#   Other bands are neutral.
# - population describes who the numbers come from; "{who}" is replaced with e.g. "Women aged 30-39".

# ----------------------------------------------------------------------------------------------
# Sources (short = the name shown next to a band)
# ----------------------------------------------------------------------------------------------

[sources.friend2015]
short = "FRIEND 2015"
citation = "Kaminsky LA, Arena R, Myers J. Reference standards for cardiorespiratory fitness measured with cardiopulmonary exercise testing: data from the Fitness Registry and the Importance of Exercise National Database (FRIEND). Mayo Clin Proc. 2015;90(11):1515-1523, table 3."
url = "https://doi.org/10.1016/j.mayocp.2015.07.026"
note = "Treadmill tests with gas analysis in apparently healthy US adults. Apple's VO2max is a submaximal estimate from outdoor walks, runs and hikes. The 2022 FRIEND update reports values a few points lower."

[sources.nhanes_pulse2011]
short = "NHANES, Ostchega 2011"
citation = "Ostchega Y, Porter KS, Hughes J, Dillon CF, Nwankwo T. Resting pulse rate reference data for children, adolescents, and adults: United States, 1999-2008. National Health Statistics Reports no. 41. National Center for Health Statistics; 2011."
url = "https://stacks.cdc.gov/view/cdc/12363"
note = "Seated 60-second pulse at a clinic visit. Apple's resting heart rate is estimated over the day while still, and usually reads lower."

[sources.statpearls_hr]
short = "StatPearls, heart rate"
citation = "StatPearls [Internet]. Treasure Island (FL): StatPearls Publishing. NCBI Bookshelf NBK553213 (adult heart rate at rest)."
url = "https://www.ncbi.nlm.nih.gov/books/NBK553213/"
note = "Clinical normal range for an adult heart rate at rest. Trained people often sit below 60 bpm without any problem."

[sources.nunan2010]
short = "Nunan 2010"
citation = "Nunan D, Sandercock GRH, Brodie DA. A quantitative systematic review of normal values for short-term heart rate variability in healthy adults. Pacing Clin Electrophysiol. 2010;33(11):1407-1417 (as summarised in Shaffer F, Ginsberg JP. Front Public Health. 2017;5:258, table 6)."
url = "https://doi.org/10.1111/j.1540-8159.2010.02841.x"
note = "SDNN from 5-minute supine recordings; the band is the range of the studies' averages (mean 50 ms, SD 16). The Watch takes shorter readings during sleep, so treat the band as indicative only."

[sources.cole1999]
short = "Cole 1999"
citation = "Cole CR, Blackstone EH, Pashkow FJ, Snader CE, Lauer MS. Heart-rate recovery immediately after exercise as a predictor of mortality. N Engl J Med. 1999;341(18):1351-1357."
url = "https://doi.org/10.1056/NEJM199910283411804"
note = "Drop from peak heart rate one minute after a symptom-limited exercise test; 12 bpm or less was abnormal. Apple measures from the end of a workout, which is often not a peak effort."

[sources.statpearls_rr]
short = "StatPearls, breathing rate"
citation = "StatPearls [Internet]. Treasure Island (FL): StatPearls Publishing. NCBI Bookshelf NBK537306 (adult respiratory rate at rest)."
url = "https://www.ncbi.nlm.nih.gov/books/NBK537306/"
note = "Adult breathing rate at rest while awake. The Watch measures during sleep, when breathing is a little slower; there is no sleep-specific norm."

[sources.statpearls_spo2]
short = "StatPearls, oxygen saturation"
citation = "StatPearls [Internet]. Treasure Island (FL): StatPearls Publishing. NCBI Bookshelf NBK525974 (oxygen saturation)."
url = "https://www.ncbi.nlm.nih.gov/books/NBK525974/"
note = "Normal arterial oxygen saturation for healthy adults. Apple notes that readings during sleep are often slightly lower (support article 120358)."

[sources.nsf2015]
short = "NSF 2015"
citation = "Hirshkowitz M, Whiton K, Albert SM, et al. National Sleep Foundation's sleep time duration recommendations: methodology and results summary. Sleep Health. 2015;1(1):40-43, table 2."
url = "https://doi.org/10.1016/j.sleh.2014.12.010"
note = "Hours of sleep per night. The published categories are in whole hours; here each 'may be appropriate' band runs up to the recommended band. The AASM/SRS consensus (Watson 2015) recommends 7 hours or more for adults aged 18-60."

[sources.ohayon2017]
short = "NSF, Ohayon 2017"
citation = "Ohayon M, Wickwire EM, Hirshkowitz M, et al. National Sleep Foundation's sleep quality recommendations: first report. Sleep Health. 2017;3(1):6-19."
url = "https://doi.org/10.1016/j.sleh.2016.11.006"
note = "Consensus on polysomnography measures. Apple's Deep stage corresponds to N3; shares are of total sleep time. Bands without consensus are left neutral."

[sources.who2020]
short = "WHO 2020"
citation = "Bull FC, Al-Ansari SS, Biddle S, et al. World Health Organization 2020 guidelines on physical activity and sedentary behaviour. Br J Sports Med. 2020;54(24):1451-1462."
url = "https://doi.org/10.1136/bjsports-2020-102955"
note = "Weekly moderate-to-vigorous activity for adults, including 65 and over. Apple's exercise minutes approximate moderate-or-harder minutes; vigorous minutes here are minutes in heart-rate zones 4 and 5."

[sources.paluch2022]
short = "Paluch 2022"
citation = "Paluch AE, Bajpai S, Bassett DR, et al. Daily steps and all-cause mortality: a meta-analysis of 15 international cohorts. Lancet Public Health. 2022;7(3):e219-e228."
url = "https://doi.org/10.1016/S2468-2667(21)00302-9"
note = "Lower mortality with more steps per day, levelling off at about 8,000-10,000 steps under 60 and 6,000-8,000 at 60 and over. More steps are not worse."

[sources.bohannon2011]
short = "Bohannon 2011"
citation = "Bohannon RW, Andrews AW. Normal walking speed: a descriptive meta-analysis. Physiotherapy. 2011;97(3):182-189."
url = "https://doi.org/10.1016/j.physio.2010.12.004"
note = "Usual (comfortable) gait speed over a short walkway; the band is the 95% confidence interval of the mean for your age and sex. The iPhone measures everyday walking on flat ground."

[sources.apple_mobility2022]
short = "Apple 2022"
citation = "Apple. Measuring Walking Quality Through Mobility Metrics. White paper, May 2022."
url = "https://www.apple.com/healthcare/docs/site/Measuring_Walking_Quality_Through_iPhone_Mobility_Metrics.pdf"
note = "Double support time is the share of the walking cycle with both feet on the ground. Typical walking ranges between 20 and 40%, with lower values indicating better balance."

[sources.gabbett2016]
short = "Gabbett 2016"
citation = "Gabbett TJ. The training-injury prevention paradox: should athletes be training smarter and harder? Br J Sports Med. 2016;50(5):273-280."
url = "https://doi.org/10.1136/bjsports-2015-095788"
note = "Acute (7-day) to chronic (28-day) workload ratio from team-sport athletes: 0.8-1.3 'sweet spot', 1.5 and above 'danger zone' for injury. Here the load is Edwards TRIMP from heart-rate zones."

